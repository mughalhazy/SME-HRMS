<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meridian HCM — Roles</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{zoom:1.1}
html,body{height:100%;overflow:hidden}
:root{
  --bg:#F5F7FA;--w:#fff;--bd:#E4E7EC;--t1:#0F1623;--t2:#374151;--t3:#64748B;--t4:#94A3B8;--t5:#F1F4F8;--t6:#FAFBFD;
  --teal:#0A8F84;--tl:#EDFAF8;--tb:#7EE8DF;
  --grn:#15803D;--gl:#DCFCE7;--amber:#B45309;--al:#FEF3C7;--red:#B91C1C;--rl:#FEE2E2;--blue:#1D4ED8;--bl:#DBEAFE;
  --mono:'JetBrains Mono',monospace;--r:8px;
}
body{font-family:'Inter',sans-serif;font-size:13px;color:var(--t1);background:var(--w);-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:4px}
.shell{display:flex;height:100vh;overflow:hidden}
.sb{width:54px;min-width:54px;background:var(--w);border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;flex-shrink:0}
.logo-m{width:34px;height:34px;border-radius:9px;background:var(--teal);display:flex;align-items:center;justify-content:center;margin-bottom:10px;flex-shrink:0}
.logo-m svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.si{width:36px;height:36px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t4);transition:all .12s}
.si:hover{background:var(--bg);color:var(--t2)}.si.on{background:var(--tl);color:var(--teal)}
.si svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.sb-div{width:28px;height:1px;background:var(--bd);margin:3px 0}
.sb-av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--teal),#0EA5E9);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;margin-top:auto;cursor:pointer;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.header{background:var(--w);border-bottom:1px solid var(--bd);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.hd-title{font-size:17px;font-weight:700;color:var(--t1);letter-spacing:-0.02em}
.hd-sub{font-size:12.5px;color:var(--t3);margin-top:3px}
.hd-right{display:flex;gap:7px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:var(--r);font-size:12.5px;font-weight:600;cursor:pointer;border:1px solid var(--bd);background:var(--w);color:var(--t2);font-family:'Inter',sans-serif;transition:all .13s;white-space:nowrap}
.btn:hover{background:var(--bg);border-color:#CBD5E1}
.btn svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-p{background:var(--teal);color:#fff;border-color:var(--teal);box-shadow:0 1px 3px rgba(10,143,132,.2)}.btn-p:hover{background:#0C9E92}
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--w);border-bottom:1px solid var(--bd);flex-shrink:0}
.stat{padding:11px 18px;border-right:1px solid var(--bd)}.stat:last-child{border-right:none}
.s-lbl{font-size:10px;font-weight:700;color:var(--t4);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.s-val{font-family:var(--mono);font-size:19px;font-weight:600;color:var(--t1);line-height:1}
.s-note{font-size:11px;color:var(--t4);margin-top:3px}
.toolbar{background:var(--w);border-bottom:1px solid var(--bd);padding:9px 18px;display:flex;align-items:center;gap:7px;flex-shrink:0}
.tab-row{display:flex;gap:2px;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:3px}
.tab{padding:4px 12px;border-radius:5px;font-size:12.5px;font-weight:500;color:var(--t3);cursor:pointer;transition:all .12s;user-select:none;white-space:nowrap}
.tab.on{background:var(--w);color:var(--t1);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tab-ct{font-family:var(--mono);font-size:10px;padding:0 4px;border-radius:3px;margin-left:3px}
.tsp{flex:1}
.sinp{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:6px 10px;width:198px;transition:all .14s}
.sinp:focus-within{background:var(--w);border-color:var(--teal);box-shadow:0 0 0 3px rgba(10,143,132,.08)}
.sinp input{background:none;border:none;outline:none;font-size:12.5px;color:var(--t1);width:100%;font-family:'Inter',sans-serif}
.sinp input::placeholder{color:var(--t4)}
.sinp svg{width:12px;height:12px;stroke:var(--t4);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sel{background:var(--w);border:1px solid var(--bd);border-radius:var(--r);padding:6px 9px;font-size:12.5px;color:var(--t2);font-family:'Inter',sans-serif;cursor:pointer;outline:none}
.table-wrap{flex:1;overflow-y:auto;min-height:0;padding-bottom:12vh}
table{width:100%;border-collapse:collapse}
thead{position:sticky;top:0;z-index:2}
thead tr{background:var(--t6);border-bottom:1px solid var(--bd)}
th{padding:9px 16px;text-align:left;font-size:10px;font-weight:700;color:var(--t4);text-transform:uppercase;letter-spacing:.07em;white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--t2)}.th-s{color:var(--teal)}
td{padding:11px 16px;border-bottom:1px solid var(--t5);vertical-align:middle;font-size:13px;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .09s;cursor:pointer}
tbody tr:hover td{background:var(--tl)}
.td-m{color:var(--t3)}.td-mono{font-family:var(--mono);font-size:12px;color:var(--t3)}
.td-mono-b{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--t1)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}
.chip::before{content:'';width:4px;height:4px;border-radius:50%;flex-shrink:0}
.cg{background:var(--gl);color:var(--grn)}.cg::before{background:#16A34A}
.ca{background:var(--al);color:var(--amber)}.ca::before{background:var(--amber)}
.cn{background:var(--t5);color:var(--t3);border:1px solid var(--bd)}.cn::before{background:var(--t4)}
.row-acts{display:flex;gap:4px;opacity:0;transition:opacity .12s}
tr:hover .row-acts{opacity:1}
.ra{width:24px;height:24px;border-radius:5px;border:1px solid var(--bd);background:var(--w);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t3);transition:all .12s}
.ra:hover{background:var(--tl);color:var(--teal);border-color:var(--tb)}
.ra svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tfoot{display:flex;align-items:center;justify-content:space-between;padding:9px 18px;background:var(--t6);border-top:1px solid var(--bd);flex-shrink:0}
.tf-info{font-size:11.5px;color:var(--t4)}
.tf-info b{font-family:var(--mono);font-weight:600;color:var(--t2)}
.pag{display:flex;gap:2px}
.pg{width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--bd);background:var(--w);color:var(--t3);font-family:var(--mono);transition:all .12s}
.pg:hover{background:var(--bg)}.pg.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.pg.dim{border:none;background:none;color:var(--t4);cursor:default}
@keyframes fu{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.a1{animation:fu .28s ease both}
</style>
</head>
<body>
<div class="shell">
<aside class="sb">
  <div class="logo-m"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></div>
  <div class="si" title="Dashboard"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></div>
  <div class="si on" title="Employees"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg></div>
  <div class="sb-div"></div>
  <div class="si" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg></div>
  <div class="sb-av">AW</div>
</aside>
<main class="main a1">
  <div class="header">
    <div><div class="hd-title">Roles</div><div class="hd-sub">38 roles across 4 categories</div></div>
    <div class="hd-right">
      <button class="btn"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Export</button>
      <button class="btn btn-p"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Create Role</button>
    </div>
  </div>
  <!-- Stats strip — BG-005 mock -->
  <div class="stats">
    <div class="stat"><div class="s-lbl">Total</div><div class="s-val">38</div><div class="s-note">defined roles</div></div>
    <div class="stat"><div class="s-lbl">Active</div><div class="s-val">34</div><div class="s-note">4 draft</div></div>
    <div class="stat"><div class="s-lbl">Filled</div><div class="s-val">29</div><div class="s-note">9 vacant</div></div>
    <div class="stat"><div class="s-lbl">Categories</div><div class="s-val">4</div><div class="s-note">Staff · Mgr · Exec · Contr</div></div>
  </div>
  <div class="toolbar">
    <div class="tab-row">
      <div class="tab on">All<span class="tab-ct" style="background:var(--t5)">38</span></div>
      <div class="tab">Active<span class="tab-ct" style="background:var(--gl);color:var(--grn)">34</span></div>
      <div class="tab">Draft<span class="tab-ct" style="background:var(--al);color:var(--amber)">4</span></div>
    </div>
    <div class="tsp"></div>
    <div class="sinp"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input placeholder="Search roles…"></div>
    <!-- EmploymentCategory enum: Staff · Manager · Executive · Contractor -->
    <select class="sel"><option>All Categories</option><option>Staff</option><option>Manager</option><option>Executive</option><option>Contractor</option></select>
    <select class="sel"><option>Sort: Title A–Z</option><option>Headcount ↓</option></select>
  </div>
  <div class="table-wrap">
    <table>
      <!-- Columns per H02 spec: Role (title + level) · Category · Status · Headcount -->
      <thead><tr>
        <th>Role</th><th>Level</th><th>Category</th><th class="th-s">Headcount ↓</th><th>Status</th><th></th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="tfoot">
    <div class="tf-info">Showing <b>1–12</b> of <b>38</b> roles</div>
    <div style="display:flex;align-items:center;gap:9px">
      <select class="sel" style="padding:3px 7px;font-size:12px"><option>12</option><option>25</option></select>
      <div class="pag"><div class="pg dim">‹</div><div class="pg on">1</div><div class="pg">2</div><div class="pg">3</div><div class="pg">4</div><div class="pg">›</div></div>
    </div>
  </div>
</main>
</div>
<script>
// employee-service › Role
// RoleStatus enum: Draft · Active · Inactive · Archived
// EmploymentCategory enum: Staff · Manager · Executive · Contractor
const roles=[
  {title:'Engineering Manager',     level:'L6',cat:'Manager',   count:4, s:'Active'},
  {title:'Senior SWE II',           level:'L5',cat:'Staff',     count:18,s:'Active'},
  {title:'Senior SWE I',            level:'L4',cat:'Staff',     count:24,s:'Active'},
  {title:'SWE II',                  level:'L3',cat:'Staff',     count:31,s:'Active'},
  {title:'DevOps Engineer',         level:'L4',cat:'Staff',     count:9, s:'Active'},
  {title:'Data Scientist',          level:'L4',cat:'Staff',     count:7, s:'Active'},
  {title:'VP of Product',           level:'L7',cat:'Executive', count:1, s:'Active'},
  {title:'Product Manager II',      level:'L5',cat:'Staff',     count:8, s:'Active'},
  {title:'UX Designer',             level:'L4',cat:'Staff',     count:6, s:'Active'},
  {title:'Account Executive',       level:'L3',cat:'Staff',     count:22,s:'Active'},
  {title:'Sales Director',          level:'L6',cat:'Manager',   count:2, s:'Active'},
  {title:'AI/ML Engineer',          level:'L5',cat:'Staff',     count:0, s:'Draft'},
];
const sc={Active:'cg',Draft:'ca',Inactive:'cn',Archived:'cn'};
document.getElementById('tbody').innerHTML=roles.map(r=>`
  <tr>
    <td style="font-weight:600;color:var(--t1)">${r.title}</td>
    <td class="td-mono">${r.level}</td>
    <td class="td-m">${r.cat}</td>
    <td class="td-mono-b">${r.count}</td>
    <td><span class="chip ${sc[r.s]||'cn'}">${r.s}</span></td>
    <td><div class="row-acts">
      <div class="ra" title="View"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></div>
      <div class="ra" title="Edit"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4z"/></svg></div>
    </div></td>
  </tr>`).join('');
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',function(){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));this.classList.add('on')}));
document.querySelectorAll('.si').forEach(el=>el.addEventListener('click',function(){document.querySelectorAll('.si').forEach(x=>x.classList.remove('on'));this.classList.add('on')}));
</script>
</body>
</html>
